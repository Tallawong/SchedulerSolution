<div class="p-4">
  <div class="container">
    @if (isLoaded) {
      <div class="border border-primary">
        <table id="scheduledTable" class="table table-striped">
          <thead>
            <tr>
              <th style="width: 20%">Email</th>
              <th style="width: 20%">Date</th>
              <th style="width: 20%">Duty</th>
              <th style="width: 20%">Team</th>
              <th style="width: 20%"></th>
            </tr>
          </thead>
          @if (poolElements) {
            <tbody>
              @for (s of poolElements; track s) {
                <tr>
                  <td>{{ s.email }}</td>
                  <td>{{ s.date }}</td>
                  <td>{{ s.userFunction }}</td>
                  <td>{{ s.scheduleGroup }}</td>
                  @if (isLoggedAsAdmin) {
                    <td style="white-space: nowrap">
                      <button
                        class="btn btn-sm btn-danger btn-delete-account"
                        type="button"
                        (click)="onDeletePoolElement($event, s.id, s.email, s.userFunction)"
                      >
                        @if (s.deleting) {
                          <span class="spinner-border spinner-border-sm mr-1"></span>
                        }
                        Delete
                      </button>
                    </td>
                  }
                </tr>
              }
            </tbody>
          }
        </table>
      </div>
    }
  </div>
</div>
