<div class="modal show d-block" style="background-color: rgba(0, 0, 0, 0.5)">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <!-- Header -->
      <div
        class="modal-header text-white flex-column align-items-start"
        style="background: linear-gradient(to right, #0d6efd, #0d5fde)"
      >
        <h5 class="modal-title">{{ title() }}</h5>
        <p class="text-white-50 mb-0 small">{{ message() }}</p>
        <ng-content select="[reg-header]"></ng-content>
      </div>

      <!-- Body -->
      <div class="modal-body">
        @if (loading()) {
          <div
            class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
            style="background: rgba(255, 255, 255, 0.75); z-index: 10"
          >
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        }
        <ng-content select="[reg-body]"></ng-content>
        @if (errorMessage()) {
          <div class="alert alert-danger mt-2 mb-0">{{ errorMessage() }}</div>
        }
        @if (successMessage()) {
          <div class="alert alert-success mt-2 mb-0">{{ successMessage() }}</div>
        }
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        @if (successMessage()) {
          <button type="button" class="btn btn-primary" (click)="onCancel()">Close</button>
        }
        @if (!successMessage()) {
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
          <button
            type="button"
            class="btn btn-primary"
            [disabled]="loading()"
            (click)="onRegister()"
          >
            Register
          </button>
        }
        <ng-content select=".reg-footer"></ng-content>
      </div>
    </div>
  </div>
</div>
