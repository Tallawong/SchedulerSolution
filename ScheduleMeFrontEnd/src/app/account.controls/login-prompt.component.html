@if (visible) {
  <div class="lp-overlay">
    <div class="lp-modal">
      <div class="lp-header">
        <h3>Welcome back</h3>
        <p class="lp-sub">Sign in to continue</p>
      </div>

      <!--form [formGroup]="myForm"-->
      <form (ngSubmit)="onSubmit()" class="lp-form">
        <label for="email">Email</label>
        <input type="email" class="lp-input" [formField]="loginForm.email" />

        <label for="password">Password</label>
        <input type="password" class="lp-input" [formField]="loginForm.password" />

        <!--label for="dob">Date of birth (DOB)</label>
  <ngxsmk-datepicker [formField]="loginForm.dateInQuestion"
               mode="single"
               placeholder="Select a date">
  </ngxsmk-datepicker-->
        <!--mat-form-field appearance="outline">
    <mat-label>Select Date</mat-label>

  </mat-form-field-->
        <label for="dob">Choose a date</label>
        <input [formField]="loginForm.dob"
               type="date"
               id="dob" 
               />

        <!--mat-form-field appearance="outline">
          <mat-label>Choose a date</mat-label>
          <input [formField]="loginForm.dateInQuestion" matInput [matDatepicker]="picker" />
          <mat-hint>MM/DD/YYYY</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field-->

        <!--ngxsmk-datepicker mode="single"
                     dateFormatPattern="'DD-MM-YYYY'"
                     displayFormat="'DD-MM-YYYY'"
                     inputMask="'DD-MM-YYYY'"
                     placeholder="DD-MM-YYYY"
                     [showCalendarButton]="true"
                     [allowTyping]="true"
                     [formField]="loginForm.dateInQuestion"
                     locale="en-AU">
  </ngxsmk-datepicker-->
        @if (errorMessage) {
        <div class="lp-error">{{ errorMessage }}</div>
        }

        <div class="lp-actions">
          <button type="submit" class="btn-primary" [disabled]="loading">
            {{ loading ? 'Signing in...' : 'Sign in' }}
          </button>
          <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
        </div>

        <div class="lp-secondary-actions">
          <button type="button" class="link-btn" (click)="onForgotPassword()">
            Forgot password?
          </button>
          <button type="button" class="link-btn" (click)="onRegister()">Register</button>
        </div>
      </form>
      <app-mfa-dialog
      [visible]="showMfa"
      (verify)="onMfaVerify($event)"
      (cancelled)="onMfaCancelled()"
    >
    </app-mfa-dialog>
    </div>
  </div>
}
