@if (visible) {
  <div class="lp-overlay">
    <div class="lp-modal">
      <div class="lp-header">
        <h3>Welcome back</h3>
        <p class="lp-sub">Sign in to continue</p>
      </div>

      <!--form [formGroup]="myForm"-->
      <form (ngSubmit)="onSubmit()" class="lp-form">
        <label for="email">Email</label>
        <input type="email" class="lp-input" [formField]="loginForm.email" />

        <label for="password">Password</label>
        <input type="password" class="lp-input" [formField]="loginForm.password" />

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Date of birth</mat-label>
          <input
            matInput
            id="dob"
            [formControl]="dobControl"
            [matDatepicker]="dobPicker"
            placeholder="dd-MM-yyyy"
          />
          <mat-datepicker-toggle matIconSuffix [for]="dobPicker"></mat-datepicker-toggle>
          <mat-datepicker #dobPicker></mat-datepicker>
          <mat-hint>dd-MM-yyyy</mat-hint>
        </mat-form-field>
        @if (errorMessage) {
          <div class="lp-error">{{ errorMessage }}</div>
        }

        <div class="lp-actions">
          <button type="submit" class="btn-primary" [disabled]="loading">
            {{ loading ? 'Signing in...' : 'Sign in' }}
          </button>
          <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
        </div>

        <div class="lp-secondary-actions">
          <button type="button" class="link-btn" (click)="onForgotPassword()">
            Forgot password?
          </button>
          <button type="button" class="link-btn" (click)="onRegister()">Register</button>
        </div>
      </form>
      <!--app-mfa-dialog
      [visible]="showMfa"
      (verify)="onMfaVerify($event)"
      (cancelled)="onMfaCancelled()"
    >
    </app-mfa-dialog-->
    </div>
  </div>
}
