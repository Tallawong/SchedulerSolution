@if (visible) {
  @if (success) {
    <div class="fp-overlay">
      <div
        class="fp-modal fp-confirmation"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="fp-confirmation-title"
        aria-describedby="fp-confirmation-message"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
      >
        <div class="fp-header">
          <h3 id="fp-confirmation-title">Request submitted</h3>
        </div>
        <div class="fp-confirmation-body">
          <p id="fp-confirmation-message">{{ success }}</p>
          <div class="fp-actions">
            <button type="button" class="btn-primary" (click)="onCancel()">OK</button>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="fp-overlay">
      <div class="fp-modal">
        <div class="fp-header">
          <h3>Forgot Password</h3>
          <p class="fp-sub">Enter your email and DOB to receive reset instructions</p>
        </div>
        @if (loading) {
          <div class="fp-loading-overlay" aria-hidden="true">
            <div class="fp-spinner" role="status" aria-label="Loading"></div>
          </div>
        }
        <form (ngSubmit)="onSubmit()" #fpForm="ngForm" class="fp-form">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            class="fp-input"
            [(ngModel)]="model.email"
            required
          />

          <label for="dob">Date of birth (DOB)</label>
          <div class="fp-mat">
            <input
              id="dob"
              name="dob"
              type="date"
              class="fp-input"
              [value]="dobModel().dob"
              (input)="onDateInputChange($event)"
            />
          </div>

          @if (error) {
            <div class="fp-error">{{ error }}</div>
          }

          <div class="fp-actions">
            <button
              type="submit"
              class="btn-primary"
              [disabled]="!fpForm.form.valid || loading"
            >
              {{ loading ? 'Submitting...' : 'Submit' }}
            </button>
            <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  }
}
