<div class="upload-panel">
  <div class="modal-header">
    <h4 class="modal-title">Import Timeslots</h4>
  </div>

  <div class="modal-body">
    <p>Select an Excel (.xlsx) file to import timeslots.</p>

    <input id="timeslots-file"
           #fileUpload
           type="file"
           class="visually-hidden"
           accept=".xlsx"
           (change)="onFileSelected($event)" />

    <label for="timeslots-file" class="btn btn-outline-primary">Choose file</label>
    <span class="ms-3 text-muted">{{ fileName || 'No file selected' }}</span>

    @if (submitted) {
    <div class="mt-4">
      <label for="timeslots-progress" class="form-label">File progress</label>
      <progress #progressFile
                id="timeslots-progress"
                class="upload-progress"
                max="100"
                [value]="uploadProgress"></progress>
    </div>
    }
  </div>

  <div class="modal-footer">
    <a [routerLink]="['../../']" class="btn btn-outline-secondary">Back</a>
    <button type="button"
            class="btn btn-outline-success"
            [disabled]="!fileHasBeenSelected || submitted"
            (click)="onSubmit(fileUpload)">
      Submit
    </button>
  </div>
</div>
