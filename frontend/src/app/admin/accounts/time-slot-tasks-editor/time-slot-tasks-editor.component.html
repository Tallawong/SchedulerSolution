<section class="time-slot-page container-fluid">
  <header class="time-slot-page-header">
    <h1>Time Slots</h1>
    <p class="text-muted mb-0">Manage time slots and their tasks.</p>
  </header>

  @if (isLoaded) {
    <form class="time-slot-form" [formGroup]="form">
      <h2>Date &amp; Tasks</h2>
      <div class="time-slot-date">
        <app-schedule-date-time
          formControlName="scheduledDate"
          (dateChange)="onChangeDateTime($event)"
        >
        </app-schedule-date-time>
        <span class="day-label">{{ getDayStrFromDate }}</span>
      </div>
      <div class="task-counters">
        @for (task of newTasksArr; track task; let index = $index) {
          @for (col of newTasksArr[index]; track col) {
            <label class="task-counter">
              <span>{{ col.agentTaskStr }}</span>
              <input
                class="form-control"
                formControlName="{{ col.agentTaskStr }}"
                type="number"
                min="0"
                max="10"
                step="1"
              />
            </label>
          }
        }
      </div>
      <button
        type="button"
        (click)="onAddUpdateTimeSlot()"
        class="btn btn-primary time-slot-action"
        [disabled]="!form.valid"
      >
        @if (isAdding) {
          <span class="spinner-border spinner-border-sm mr-1"></span>
        }
        Add/Update
      </button>
    </form>
  }

  <main class="time-slot-list">
    <h2>Time Slot Dates</h2>
    <div class="time-slot-table-region">
      <mat-table
        #table
        class="lessons-table time-slot-table"
        [dataSource]="dataSource"
        matSort
        (matSortChange)="sortData($event)"
      >
        <ng-container matColumnDef="{{ displayedColumns[0] }}">
          <mat-header-cell *matHeaderCellDef mat-sort-header>
            {{ displayedLabels[0] }}
          </mat-header-cell>
          <mat-cell *matCellDef="let row">
            <input type="text" matInput [value]="row.date" readonly />
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="{{ displayedColumns[1] }}">
          <mat-header-cell *matHeaderCellDef> {{ displayedLabels[1] }} </mat-header-cell>
          <mat-cell *matCellDef="let row">
            <input type="text" matInput [value]="row.tasks.join(' ')" readonly />
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="delete">
          <mat-header-cell *matHeaderCellDef> Delete </mat-header-cell>
          <mat-cell *matCellDef="let row">
            <button
              class="btn btn-sm btn-danger btn-delete-account"
              type="button"
              #button
              (click)="onDeleteTimeSlotTasks($event, row)"
              [disabled]="row.isDeleting"
            >
              @if (row.isDeleting) {
                <span class="spinner-border spinner-border-sm mr-1"></span>
              }
              Delete
            </button>
          </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row
          *matRowDef="let row; columns: displayedColumns"
          [ngClass]="{ hovered: row.hovered, highlighted: row.highlighted }"
          (click)="onRowSelected(row, $event)"
          (mouseover)="row.hovered = true"
          (mouseout)="row.hovered = false"
        ></mat-row>
      </mat-table>
      <mat-paginator
        #paginator
        class="lessons-table time-slot-paginator"
        [length]="timeSlots().length"
        [pageSizeOptions]="[5, 10, 20, 50, 100]"
        pageSize="{{ pageSize }}"
        (page)="onChangePageProperties($event)"
        showFirstLastButtons
      >
      </mat-paginator>
    </div>
  </main>
  <div class="time-slot-actions">
    <a routerLink="../" class="btn btn-primary time-slot-action">Back</a>
  </div>
</section>
