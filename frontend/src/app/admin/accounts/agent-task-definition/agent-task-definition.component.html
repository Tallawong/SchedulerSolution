<section class="task-page container-fluid">
  <header class="task-page-header">
    <h1>Agent Tasks</h1>
    <p class="text-muted mb-0">Manage agent task names and groups.</p>
  </header>

  @if (isLoaded) {
    <form class="task-form" [formGroup]="form" (ngSubmit)="onAddUpdateTask()">
      <h2>Agent Task</h2>
      <div class="task-form-fields">
        <mat-form-field appearance="outline">
          <mat-label>Agent Task Name</mat-label>
          <input matInput formControlName="agentTaskName" />
        </mat-form-field>
        <mat-checkbox formControlName="isGroupBox">Is Group Task</mat-checkbox>
      </div>
      <button type="submit" class="btn btn-primary task-action" [disabled]="!form.valid || isAdding">
        @if (isAdding) {
          <span class="spinner-border spinner-border-sm mr-1"></span>
        }
        Add/Update
      </button>
    </form>
  }

  <main class="task-list">
    <h2>Agent Task Names</h2>
    <div class="task-table-region">
      <mat-table
        #table
        class="lessons-table task-table"
        [dataSource]="dataSource"
        matSort
        (matSortChange)="sortData($event)"
      >
        <ng-container matColumnDef="{{ displayedColumns[0] }}">
          <mat-header-cell *matHeaderCellDef mat-sort-header>
            {{ displayedColumns[0] }}
          </mat-header-cell>
          <mat-cell *matCellDef="let row">
            <input type="text" matInput [value]="row.agentTaskStr" readonly />
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="{{ displayedColumns[1] }}">
          <mat-header-cell *matHeaderCellDef mat-sort-header>
            {{ displayedColumns[1] }}
          </mat-header-cell>
          <mat-cell *matCellDef="let row">
            <mat-checkbox class="margin" [checked]="row.isGroup" [disabled]="true"
              >Is Group Task</mat-checkbox
            >
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="{{ displayedColumns[2] }}">
          <mat-header-cell *matHeaderCellDef> {{ displayedColumns[2] }} </mat-header-cell>
          <mat-cell *matCellDef="let row">
            <button
              class="btn btn-sm btn-danger btn-delete-account"
              type="button"
              #button
              (click)="onDeleteAgentTaskConfig($event, row)"
              [disabled]="row.isDeleting"
            >
              @if (row.isDeleting) {
                <span class="spinner-border spinner-border-sm mr-1"></span>
              }
              Delete
            </button>
          </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row
          *matRowDef="let row; columns: displayedColumns"
          [ngClass]="{ highlighted: row.highlighted }"
          (click)="onRowSelected(row, $event)"
          (mouseover)="row.hovered = true"
          (mouseout)="row.hovered = false"
        ></mat-row>
      </mat-table>
      <mat-paginator
        #paginator
        class="lessons-table task-paginator"
        [length]="agentTaskConfigs().length"
        pageSize="{{ pageSize }}"
        (page)="onChangePageProperties($event)"
        [pageSizeOptions]="[5, 10, 20, 50, 100]"
        showFirstLastButtons
      >
      </mat-paginator>
    </div>
  </main>
  <div class="task-actions">
    <a routerLink="../" class="btn btn-primary task-action">Back</a>
  </div>
</section>
