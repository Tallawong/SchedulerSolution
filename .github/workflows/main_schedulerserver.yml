# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#  ASP.Net Core app
# 1. az role assignment list --assignee-object-id 0bc766eb-9a8c-4ef0-87e3-f5ff264da09c --all --query "[].{role:roleDefinitionName,scope:scope}" -o table
# 2. If empty, assign Contributor on JDGroup:
# 3. az role assignment create `
#  --assignee-object-id 0bc766eb-9a8c-4ef0-87e3-f5ff264da09c `
#  --assignee-principal-type ServicePrincipal `
#  --role Contributor `
#  --scope /subscriptions/2a29b280-6d2c-4128-b420-4ae90d834382/resourceGroups/JDGroup

name: App Service

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/main_schedulerserver.yml'
      - 'Solution.slnx'
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' 
      || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test variables
        run: |
          echo "DOTNET_ROOT: ${{env.DOTNET_ROOT}}"
          echo "GITHUB_WORKSPACE: ${{env.GITHUB_WORKSPACE}}"

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6981EE39CDB44A4886EAAE0E3C5E6EE9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7E079A6D7B1E4044AC16EC4E00C04749 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_84B3308530034895AB91739F1E7AF2BD }}

      - name: Resolve App Service name from resource group
        id: resolve-app-name
        shell: pwsh
        env:
          RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME || 'JDGroup' }}
        run: |
          $appName = az resource list -g "$env:RESOURCE_GROUP_NAME" --resource-type "Microsoft.Web/sites" --query "[?starts_with(name, 'scheduler-api-')].name | [0]" -o tsv
          if ([string]::IsNullOrWhiteSpace($appName)) {
            Write-Error "No App Service matching 'scheduler-api-*' was found in resource group '$env:RESOURCE_GROUP_NAME'."
            exit 1
          }
          "app_name=$appName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update Azure App Settings with GitHub Secrets
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ steps.resolve-app-name.outputs.app_name }}
          app-settings-json: |
            [
              {
                "name": "Kestrel:Endpoints:Https:Url",
                "value": "${{ secrets.APPSETTINGS_SMTPPASS }}",
                "slotSetting": false
              },
              {
                "name": "AppSettings:BrevoApiKey",
                "value": "${{ secrets.APPSETTINGS__BREVOAPIKEY }}",
                "slotSetting": false
              },
              {
                "name": "AppSettings:JwtSecret",
                "value": "${{ secrets.APPSETTINGS__JWTSECRET }}",
                "slotSetting": false
              },
              {
                "name": "AppSettings:SmtpPass",
                "value": "${{ secrets.APPSETTINGS__SMTPPASS }}",
                "slotSetting": false
              },
              {
                "name": "AppSettings:SpryngApiToken",
                "value": "${{ secrets.APPSETTINGS__SPRYNGAITOKEN }}",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve-app-name.outputs.app_name }}
          slot-name: 'Production'
          package: .
          