name: Experiments with Variables
on:
  workflow_dispatch:

env:
  MY_FAVORITE_NO: 2

jobs:
# --- BUILD BACKEND JOB ---
  build-vars-experiments:
    runs-on: [self-hosted, windows, x64, gpu]
    environment: production

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Produce script sharing variable
        id: script-id
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Reference script sharing variable
        env:
          script_var: ${{steps.script-id.outputs.result}}
        run: |
          echo "script_var_value:$env:script_var" | & 'C:\Users\Janusz\Downloads\PortableGit\usr\bin\sed.exe' 's/./& /g'
      ###############################################################
      - name: Produce step sharing variable
        id: step-id
        run: |
          echo "step_sharing_var=renia" >> $env:GITHUB_ENV
          echo "step_sharing_var=renia" >> $env:GITHUB_OUTPUT

      - name: Reference step sharing variable
        run: |
          echo "step sharing var is $env:step_sharing_var"
          echo "step sharing var is ${{steps.step-id.outputs.step_sharing_var}}"
      ###############################################################
      - name: Reference production env variable APPSETTINGS_SMTPPASS
        run: |
          echo "APPSETTINGS_SMTPPASS is ${{secrets.APPSETTINGS_SMTPPASS}}" | & 'C:\Users\Janusz\Downloads\PortableGit\usr\bin\sed.exe' 's/./& /g'

      ################################################################
      ###### SHARING VARIABLES BETWEEN JOBS
  job1:
    needs : build-vars-experiments
    runs-on: [self-hosted, windows, x64, gpu]
    outputs:
      my_output_var: ${{ steps.step1.outputs.VALUE }}
    steps:
      - id: step1
        run: echo "VALUE=hello-world" >> $GITHUB_OUTPUT

  job2:
    runs-on: [self-hosted, windows, x64, gpu]
    needs: job1
    steps:
      - run: echo "Received value is ${{ needs.job1.outputs.my_output_var }}"