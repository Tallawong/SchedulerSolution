name: Variables
on:
  workflow_dispatch:

env:
  MY_FAVORITE_NO: 2

jobs:
# --- BUILD BACKEND JOB ---
  build-vars-experiments:
    runs-on: [self-hosted, windows, x64, gpu]

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Produce var from script
        id: script-id
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Consume script id var1
        env:
          script-var: ${{steps.script-id.outputs.result}}
        run: |
          echo "script-var-value:$env:script-var"

      - name: Consume script id var2
        run: |
          echo "script-var-value:${{steps.script-id.outputs.result}}" >> $env:GITHUB_ENV
          echo "new-var-value:$env:script-var-value"

      - name: Produce variable to share with another step
        id: produce_var
        run: |
          echo "::set-output name=var1::renia"

      - name: Consume variables
        run: echo var1=${{ steps.produce_var.outputs.var1 }}  

