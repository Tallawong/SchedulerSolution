name: Variables
on:
  workflow_dispatch:

env:
  MY_FAVORITE_NO: 2

jobs:
# --- BUILD BACKEND JOB ---
  build-vars-experiments:
    runs-on: [self-hosted, windows, x64, gpu]

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Produce var from script
        id: script-id
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Consume script id var1
        env:
          script_var: ${{steps.script-id.outputs.result}}
        run: |
          echo "script_var_value:$env:script_var"

      - name: Consume script id var2
        run: |
          echo "script_var_value=${{steps.script-id.outputs.result}}" >> $env:GITHUB_ENV

      - name: Display script id var2
        run: |
          echo "new_var_value $env:script_var_value"

      - name: Produce variable old way to share with another step
        id: produce_var
        run: |
          echo "name=var1::renia:" >> $GITHUB_ENV

      - name: Consume variables
        run: echo var1=${{ steps.produce_var.outputs.var1 }}  

