name: Experiments with Variables
on:
  workflow_dispatch:

env:
  MY_FAVORITE_NO: 2

jobs:
# --- BUILD BACKEND JOB ---
  build-vars-experiments:
    runs-on: [self-hosted, windows, x64, gpu]

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Produce script sharing variable
        id: script-id
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Reference script sharing variable
        env:
          script_var: ${{steps.script-id.outputs.result}}
        run: |
          echo "script_var_value:$env:script_var" | sed 's/./& /g'
      ###############################################################
      - name: Produce step sharing variable
        id: step-id
        run: |
          echo "step_sharing_var=renia" >> $env:GITHUB_ENV

      - name: Reference step sharing variable
        run: |
          echo "step sharing var $env:step_sharing_var"
      ###############################################################
      - name: Reference production env variable APPSETTINGS_SMTPPASS
        run: |
          echo "APPSETTINGS_SMTPPASS is {{var:APPSETTINGS_SMTPPASS}}" | & 'C:\Users\Janusz\Downloads\PortableGit\usr\bin\sed.exe' 's/./& /g'

