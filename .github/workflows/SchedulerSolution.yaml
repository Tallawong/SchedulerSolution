name: CI/CD Pipeline

on:
  workflow_dispatch:
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Build and Test Angular Frontend
  # ==========================================
  build-frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Match your Angular version requirement
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Linter
      run: npm run lint

    - name: Run Frontend Tests
      run: npm test -- --watch=false

    - name: Build Production Bundle
      run: npm run build -- --configuration=production

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: angular-dist
        path: ./frontend/dist/frontend/browser/
        if-no-files-found: error

  # ==========================================
  # JOB 2: Build and Publish .NET API
  # ==========================================
  build-backend:
    runs-on: windows-latest
    needs: build-frontend # Ensures UI builds first if you integrate files into wwwroot
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore backend.csproj

    - name: Build Solution
      run: dotnet build backend.csproj --no-restore --configuration Release

    # Optional: If hosting Angular directly via ASP.NET Core UseStaticFiles()
    - name: Download Frontend Artifacts into API wwwroot
      uses: actions/download-artifact@v4
      with:
        name: angular-dist
        path: ./backend/wwwroot

    - name: Publish API
      run: dotnet publish backend.csproj --no-restore --configuration Release --output ./publish

    - name: Upload Deployment Package
      uses: actions/upload-artifact@v4
      with:
        name: app-deploy-package
        path: ./backend/publish/
        if-no-files-found: error

  # ==========================================
  # JOB 3: Deploy Package (Target Independent)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download App Package
      uses: actions/download-artifact@v4
      with:
        name: app-deploy-package
        path: ./app

    # Place your target provider deployment block below:
    # Example for Azure Web App:
    # - name: Deploy to Azure Web App
    #   uses: azure/webapps-deploy@v3
    #   with:
    #     app-name: 'your-app-name'
    #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    #     package: ./app
