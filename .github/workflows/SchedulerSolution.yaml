name: CI/CD Pipeline

on:
  workflow_dispatch
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Build and Test Angular Frontend
  # ==========================================
  build-frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./client # Path to your Angular app

    steps:
    - name: Checkout repository
      uses: actions/checkout@7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@7.0.1
      with:
        node-version: '24' # Match your Angular version requirement
        cache: 'npm'
        cache-dependency-path: ./client/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter & Tests
      run: |
        npm run lint --if-present
        npm run test -- --watch=false --browsers=ChromeHeadless --if-present

    - name: Build Production Bundle
      run: npm run build -- --configuration production

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@7.0.1
      with:
        name: angular-dist
        path: ./client/dist/

  # ==========================================
  # JOB 2: Build, Test, and Publish .NET API
  # ==========================================
  build-backend:
    runs-on: windows-latest
    needs: build-frontend # Ensures UI builds first if you integrate files into wwwroot
    defaults:
      run:
        working-directory: ./api # Path to your .NET Solution/Project

    steps:
    - name: Checkout repository
      uses: actions/checkout7.0.1

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@7.0.1
      with:
        dotnet-version: '8.0.x' # Updates to '9.0.x' or '10.0.x' as needed

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run backend tests
      run: dotnet test --no-build --verbosity normal

    # Optional: If hosting Angular directly via ASP.NET Core UseStaticFiles()
    - name: Download Frontend Artifacts into API wwwroot
      uses: actions/download-artifact@7.0.1
      with:
        name: angular-dist
        path: ./api/wwwroot # Adjust if your project maps static files elsewhere

    - name: Publish API
      run: dotnet publish --configuration Release --output ./publish

    - name: Upload Deployment Package
      uses: actions/upload-artifact@7.0.1
      with:
        name: app-deploy-package
        path: ./api/publish/

  # ==========================================
  # JOB 3: Deploy Package (Target Independent)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download App Package
      uses: actions/download-artifact@7.0.1
      with:
        name: app-deploy-package
        path: ./app

    # Place your target provider deployment block below:
    # Example for Azure Web App:
    # - name: Deploy to Azure Web App
    #   uses: azure/webapps-deploy@v3
    #   with:
    #     app-name: 'your-app-name'
    #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    #     package: ./app
