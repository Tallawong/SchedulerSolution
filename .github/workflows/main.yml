name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --- BACKEND JOB ---
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Or '10.0.x' depending on target

      - name: Restore Dependencies
        run: dotnet restore backend/MySolution.sln

      - name: Build Backend
        run: dotnet build backend/MySolution.sln --no-restore --configuration Release

      - name: Run Backend Tests
        run: dotnet test backend/MySolution.sln --no-build --verbosity normal

  # --- FRONTEND JOB ---
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint and Format
        run: |
          npm run lint
          npm run format:check
        working-directory: ./frontend

      - name: Run Frontend Tests
        run: npm run test:ci # Configured to run Chrome Headless
        working-directory: ./frontend

      - name: Build Angular App
        run: npm run build -- --configuration=production
        working-directory: ./frontend
