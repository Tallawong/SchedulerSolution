name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]



# Allows you to runthis workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # --- BACKEND JOB ---
  backend-ci:
    runs-on: [self-hosted]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:

          dotnet-version: '10.0.x' # Or '10.0.x' depending on target

      - name: Restore Dependencies
        run: dotnet restore backend/backend.csproj

      - name: Build Backend
        run: dotnet build backend/backend.csproj --no-restore --configuration Release

      - name: Run Backend Tests
        run: dotnet test backend/backend.csproj --no-build --verbosity normal

  # --- FRONTEND JOB ---
  frontend-ci:
    runs-on: [self-hosted]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./frontend

      - name: Lint and Format
        run: |
          npm run lint -fix
          npm run format:check
        working-directory: ./frontend

      - name: Run Frontend Tests
        run: npm run test:ci # Configured to run Chrome Headless
        working-directory: ./frontend

      - name: Build Angular App
        run: npm run build -- --configuration=production
        working-directory: ./frontend
